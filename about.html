<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Caleb Bellsmith</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="display-4 fw-bold text-teal mb-4" id="about-title"></h1>
                <p class="lead mb-4" id="about-desc"></p>
                <h4 class="fw-bold mb-3">Skills & Tools</h4>
                <div id="skills-list" class="d-flex flex-wrap gap-2"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data.js"></script>
    <script src="components.js"></script>
    <script>
        injectCommonElements();
        document.getElementById('about-title').innerText = SITE_DATA.about.title;
        document.getElementById('about-desc').innerText = SITE_DATA.about.description;
        document.getElementById('skills-list').innerHTML = SITE_DATA.about.skills.map(skill => `<span class="badge bg-secondary p-2">${skill}</span>`).join('');
    </script>
</body>
</html>
