<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Caleb Bellsmith</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { 
            --teal-accent: #0a9396; 
            --deep-bg: #0f172a; /* Sophisticated deep slate blue/black */
            --card-bg: rgba(255, 255, 255, 0.03); 
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--deep-bg);
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .navbar { 
            background-color: rgba(15, 23, 42, 0.9) !important; 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }
        
        /* Modern "Glass" Project Cards */
        .project-card { 
            border: 1px solid var(--glass-border); 
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            margin-bottom: 5rem; 
            overflow: hidden; 
            border-radius: 20px;
        }
        
        .project-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--teal-accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Black image containers for maximum contrast */
        .asset-grid { 
            background-color: #000; 
            padding: 25px; 
            display: flex; 
            align-items: center; 
        }

        .asset-img { 
            width: 100%; 
            height: 350px; 
            object-fit: contain; 
            border-radius: 12px; 
            background-color: #000; 
            cursor: pointer; 
            transition: 0.4s ease;
            filter: brightness(0.9);
        }

        .asset-img:hover { 
            transform: scale(1.04); 
            filter: brightness(1.1);
        }

        .asset-img-stacked { height: 171px !important; margin-bottom: 8px; }

        .tech-label { 
            font-weight: 700; 
            color: var(--teal-accent); 
            min-width: 80px; 
            display: inline-block; 
            text-transform: uppercase; 
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        
        .project-title { 
            font-weight: 800; 
            color: #f8fafc;
            letter-spacing: -0.02em; 
        }
        
        .lead-text { color: #94a3b8; font-weight: 400; }
        .body-text { color: #cbd5e1; font-size: 0.95rem; }

        footer { 
            background: #000; 
            border-top: 1px solid var(--glass-border);
            padding: 4rem 0; 
        }
        
        #lightboxImage { width: 100%; max-height: 85vh; object-fit: contain; }

        @media (min-width: 768px) {
            .row-alternate:nth-child(even) { flex-direction: row-reverse; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">CALEB BELLSMITH</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="projects.html">Projects</a>
            <a class="nav-link" href="about.html">About</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="display-4 fw-bold mb-5 text-center" style="color: #f8fafc;">Engineering Portfolio</h1>
    <div id="project-list"></div>
</div>

<div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-black border-0">
            <div class="modal-body p-0 text-center">
                <img src="" id="lightboxImage" class="img-fluid rounded shadow-lg">
                <div class="p-4">
                    <button type="button" class="btn btn-outline-light rounded-pill px-4" data-bs-dismiss="modal">Close Gallery</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const projects = [
        {
            title: "Custom Cedar Strip Canoe",
            lead: "A 17-foot custom build mixing traditional woodworking with digital fabrication.",
            why: "Blended outdoor passion with design concepts. Built to experiment with CNC machining and 3D modeling.",
            how: "Utilized CAD for molds and CNC for secondary molds to ensure high accuracy. Every cedar plank was milled from scratch.",
            specs: "17-foot build; custom-made components for a professional finish.",
            images: ["images/canoe.jpg", "images/stems.jpg"],
            layout: "normal",
            imgCol: "col-md-6"
        },
        {
            title: "Tilting Maze Platform",
            lead: "A modular, tilting platform featuring swappable mazes and ESP32 control.",
            why: "To gain experience with microcontrollers and rotational actuation in mechanical design.",
            how: "Designed and 3D printed components using high-torque servos and an ESP32 for responsiveness.",
            specs: "Custom-built circuitry; currently integrating webcam-based computer vision for autonomous navigation.",
            images: ["images/balance.jpg"],
            layout: "normal",
            imgCol: "col-md-12"
        },
        {
            title: "Orthotic Hand Exoskeleton",
            lead: "A mechanical, 3D-printed device assisting individuals with limited mobility.",
            why: "Shifts heavy lifting from the hand/forearm via mechanical linkage.",
            how: "Iterated through dozens of 3D-printed prototypes for optimal strength and comfort.",
            specs: "100% 3D-printed; scalable design for specific finger support.",
            images: ["images/hand_exoskeleton.jpg", "images/test.jpg", "images/failures.jpg"],
            layout: "stacked",
            imgCol: "col-6"
        },
        {
            title: "Custom Finger Prosthetics",
            lead: "3D-printed prosthetics for a patient with scleroderma.",
            why: "Focused on restoring writing ability and ensuring long-term functional fit.",
            how: "Modeled ergonomic designs with tool inserts and lockable rotation.",
            specs: "Custom-fitted and task-optimized for writing and orientation.",
            images: ["images/prosthetic_fingers.jpg", "images/issue.jpg", "images/fitted.jpg"],
            layout: "normal",
            imgCol: "col-md-4"
        }
    ];

    const projectList = document.getElementById('project-list');

    projects.forEach((project) => {
        let imageMarkup = "";
        if (project.layout === "stacked") {
            imageMarkup = `
                <div class="col-6">
                    <img src="${project.images[0]}" class="asset-img asset-img-stacked" onclick="openLightbox(this.src)">
                    <img src="${project.images[1]}" class="asset-img asset-img-stacked" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6">
                    <img src="${project.images[2]}" class="asset-img" style="height: 350px;" onclick="openLightbox(this.src)">
                </div>
            `;
        } else {
            imageMarkup = project.images.map(img => `
                <div class="${project.imgCol}">
                    <img src="${img}" class="asset-img mb-2" onclick="openLightbox(this.src)">
                </div>
            `).join('');
        }

        projectList.innerHTML += `
            <div class="card project-card">
                <div class="row g-0 row-alternate">
                    <div class="col-lg-6 asset-grid">
                        <div class="row g-2 w-100 justify-content-center">
                            ${imageMarkup}
                        </div>
                    </div>
                    <div class="col-lg-6 d-flex align-items-center">
                        <div class="card-body p-4 p-xl-5">
                            <h2 class="project-title fw-bold mb-3 border-bottom pb-2">${project.title}</h2>
                            <p class="lead lead-text mb-4">${project.lead}</p>
                            <p class="body-text"><span class="tech-label">Why</span> ${project.why}</p>
                            <p class="body-text"><span class="tech-label">How</span> ${project.how}</p>
                            <p class="body-text"><span class="tech-label">Specs</span> ${project.specs}</p>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    // SolidWorks Gallery
    projectList.innerHTML += `
        <div class="card project-card">
            <div class="card-body p-5 text-center">
                <h2 class="project-title fw-bold mb-3 border-bottom pb-2">Technical Design & SolidWorks Gallery</h2>
                <p class="lead lead-text mb-5">Various SolidWorks projects ranging from mechanical assemblies to aesthetic custom requests.</p>
                <div class="asset-grid rounded-4">
                    <div class="row g-3">
                        ${["swjet.jpg", "swflower.jpg", "flower.jpg", "snowman.jpg", "magno.png", "card.png"].map(img => `
                            <div class="col-6 col-md-4">
                                <img src="images/${img}" class="asset-img" onclick="openLightbox(this.src)">
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </div>
    `;

    const lbModal = new bootstrap.Modal(document.getElementById('lightboxModal'));
    const lbImage = document.getElementById('lightboxImage');
    function openLightbox(src) { lbImage.src = src; lbModal.show(); }
</script>
</body>
</html>
