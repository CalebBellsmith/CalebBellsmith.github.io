<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Caleb Bellsmith</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { 
            --teal-main: #005f73; 
            --deep-dark: #1a1a1a; 
            --blueprint-blue: #f0f4f8;
        }

        body {
            /* Blueprint grid aesthetic background */
            background-color: var(--blueprint-blue);
            background-image: 
                linear-gradient(#d1d9e0 1px, transparent 1px),
                linear-gradient(90deg, #d1d9e0 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .navbar { background-color: var(--teal-main) !important; }
        .text-teal { color: var(--teal-main); }
        
        .project-card { 
            border: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            margin-bottom: 5rem; 
            overflow: hidden; 
            border-radius: 16px;
            background: #fff;
        }
        .project-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        /* Matte black background for images */
        .asset-grid { 
            background-color: var(--deep-dark); 
            padding: 20px; 
            display: flex; 
            align-items: center; 
        }

        .asset-img { 
            width: 100%; 
            height: 350px; 
            object-fit: contain; 
            border-radius: 8px; 
            background-color: var(--deep-dark); /* Black background for each image */
            cursor: pointer; 
            transition: transform 0.4s ease;
        }

        .asset-img-stacked { height: 171px !important; margin-bottom: 8px; }
        .asset-img:hover { transform: scale(1.03); }

        .tech-label { 
            font-weight: 800; 
            color: var(--teal-main); 
            min-width: 75px; 
            display: inline-block; 
            text-transform: uppercase; 
            font-size: 0.85rem; 
        }
        .project-title { font-weight: 800; letter-spacing: -0.5px; }
        .lead-text { color: #444; font-weight: 500; }

        footer { background: #212529; color: white; padding: 3rem 0; }
        #lightboxImage { width: 100%; max-height: 85vh; object-fit: contain; }

        @media (min-width: 768px) {
            .row-alternate:nth-child(even) { flex-direction: row-reverse; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">CALEB BELLSMITH</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="projects.html">Projects</a>
            <a class="nav-link" href="about.html">About</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="display-4 fw-bold mb-5 text-center text-teal" style="text-shadow: 2px 2px 0px #fff;">Engineering Portfolio</h1>
    <div id="project-list"></div>
</div>

<div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-dark border-0">
            <div class="modal-body p-0 text-center">
                <img src="" id="lightboxImage" class="img-fluid rounded">
                <div class="p-3">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Close Gallery</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const projects = [
        {
            title: "Custom Cedar Strip Canoe",
            lead: "I designed and built a 17-foot cedar strip canoe that mixes traditional woodworking with modern digital fabrication.",
            why: "I’ve always loved the outdoors and wanted to blend that passion with advancing design concepts. Building this canoe allowed for full customization of every detail while getting hands-on with CNC machining and 3D modeling.",
            how: "We utilized CAD and 3D modeling to perfect the molds. Then, a CNC machine was used for the secondary molds to ensure high accuracy. Every cedar plank was milled from scratch to ensure a tight fit and proper adhesive bonding.",
            specs: "A classic 17-foot cedar strip canoe where every component was custom-made for a clean, professional finish.",
            images: ["images/canoe.jpg", "images/stems.jpg"],
            layout: "normal",
            imgCol: "col-md-6"
        },
        {
            title: "Tilting Maze Platform",
            lead: "I designed and created a tilting platform featuring a swappable modular maze.",
            why: "To gain applicable experience with microcontrollers and rotational actuation, I developed this tilting maze as a way to integrate my interests in mechanical design and embedded systems.",
            how: "I designed and 3D printed all mechanical components, utilizing high-torque servos, a potentiometer, and an ESP32 to create a functional, responsive system. The maze module is fully swappable, supporting a variety of custom levels.",
            specs: "Every component, including the internal circuitry, was custom-built. I am currently integrating a webcam and computer vision code to enable autonomous navigation.",
            images: ["images/balance.jpg"],
            layout: "normal",
            imgCol: "col-md-12"
        },
        {
            title: "Orthotic Hand Exoskeleton",
            lead: "A fully mechanical, 3D-printed device designed to assist individuals with limited upper-limb mobility.",
            why: "This design was created to assist individuals with minimal forearm, hand, and wrist strength by shifting the heavy lifting away from the hand through a mechanical linkage.",
            how: "I went through dozens of 3D-printed prototypes to determine the optimal design for strength and fitment, using iterative feedback to maximize user comfort.",
            specs: "100% 3D-printed and purely mechanical. The design is scalable, allowing for customized support across specific fingers.",
            images: ["images/hand_exoskeleton.jpg", "images/test.jpg", "images/failures.jpg"],
            layout: "stacked",
            imgCol: "col-6"
        },
        {
            title: "Custom Finger Prosthetics",
            lead: "Custom 3D-printed prosthetic fingers developed for a patient with amputations resulting from scleroderma.",
            why: "The primary goal was to restore writing ability and daily usability. I focused on achieving a perfect fit to ensure long-term comfort and functional reliability.",
            how: "I modeled several ergonomic designs featuring specialized tool inserts and lockable rotation to account for various daily tasks and patient needs.",
            specs: "Custom-fitted and optimized for specific tasks like writing or locking in specialized orientations.",
            images: ["images/prosthetic_fingers.jpg", "images/issue.jpg", "images/fitted.jpg"],
            layout: "normal",
            imgCol: "col-md-4"
        }
    ];

    const projectList = document.getElementById('project-list');

    projects.forEach((project) => {
        let imageMarkup = "";

        if (project.layout === "stacked") {
            imageMarkup = `
                <div class="col-6">
                    <img src="${project.images[0]}" class="asset-img asset-img-stacked" onclick="openLightbox(this.src)">
                    <img src="${project.images[1]}" class="asset-img asset-img-stacked" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6">
                    <img src="${project.images[2]}" class="asset-img" style="height: 350px;" onclick="openLightbox(this.src)">
                </div>
            `;
        } else {
            imageMarkup = project.images.map(img => `
                <div class="${project.imgCol}">
                    <img src="${img}" class="asset-img mb-2" onclick="openLightbox(this.src)">
                </div>
            `).join('');
        }

        projectList.innerHTML += `
            <div class="card project-card">
                <div class="row g-0 row-alternate">
                    <div class="col-lg-6 asset-grid">
                        <div class="row g-2 w-100 justify-content-center">
                            ${imageMarkup}
                        </div>
                    </div>
                    <div class="col-lg-6 d-flex align-items-center">
                        <div class="card-body p-4 p-xl-5">
                            <h2 class="project-title fw-bold mb-3 border-bottom pb-2 text-teal">${project.title}</h2>
                            <p class="lead lead-text mb-4">${project.lead}</p>
                            <p><span class="tech-label">Why</span> ${project.why}</p>
                            <p><span class="tech-label">How</span> ${project.how}</p>
                            <p><span class="tech-label">Specs</span> ${project.specs}</p>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    // SolidWorks Gallery
    projectList.innerHTML += `
        <div class="card project-card">
            <div class="card-body p-4 p-xl-5 text-center">
                <h2 class="project-title fw-bold mb-3 border-bottom pb-2 text-teal">Technical Design & SolidWorks Gallery</h2>
                <p class="lead lead-text mb-4">A collection of various SolidWorks projects ranging from mechanical assemblies to aesthetic custom requests.</p>
                <div class="asset-grid rounded">
                    <div class="row g-3">
                        ${["swjet.jpg", "swflower.jpg", "flower.jpg", "snowman.jpg", "magno.png", "card.png"].map(img => `
                            <div class="col-6 col-md-4">
                                <img src="images/${img}" class="asset-img" onclick="openLightbox(this.src)">
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </div>
    `;

    const lbModal = new bootstrap.Modal(document.getElementById('lightboxModal'));
    const lbImage = document.getElementById('lightboxImage');
    function openLightbox(src) { lbImage.src = src; lbModal.show(); }
</script>
</body>
</html>
