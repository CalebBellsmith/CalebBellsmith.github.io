<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Caleb Bellsmith</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="display-4 fw-bold mb-5 text-center text-teal">Projects</h1>
        <div id="project-container"></div>
    </div>

    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0"><div class="modal-body p-0 text-center">
                <img src="" id="lightboxImage" class="img-fluid rounded">
                <button type="button" class="btn btn-light mt-3" data-bs-dismiss="modal">Close</button>
            </div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data.js"></script>
    <script src="components.js"></script>
    <script>
        injectCommonElements();
        const container = document.getElementById('project-container');
        SITE_DATA.projects.forEach(proj => {
            const imageHtml = proj.images.map(img => `<div class="${proj.columns}"><img src="${img}" class="asset-img" onclick="openLightbox('${img}')"></div>`).join('');
            const textHtml = `<div class="card-body p-4"><h3 class="fw-bold mb-3 border-bottom pb-2">${proj.title}</h3><p class="lead">${proj.lead}</p>${proj.why ? `<p><span class="tech-label">Why:</span> ${proj.why}</p>` : ''} ${proj.how ? `<p><span class="tech-label">How:</span> ${proj.how}</p>` : ''}</div>`;
            container.innerHTML += `<div class="card project-card">${proj.textFirst ? textHtml : ''}<div class="asset-grid"><div class="row g-2 justify-content-center">${imageHtml}</div></div>${!proj.textFirst ? textHtml : ''}</div>`;
        });
    </script>
</body>
</html>
