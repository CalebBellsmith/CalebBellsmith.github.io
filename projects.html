<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">

</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">Caleb Bellsmith</a>
      <ul class="nav-links">
        <li><a href="projects.html" class="active">Projects</a></li>
        <li><a href="about.html">Experience</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><button class="theme-btn" id="themeBtn" onclick="toggleTheme()">Dark</button></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="page-container">
      <div class="projects-header page-fade">
        <h1>Projects</h1>
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="collaborative">Collaborative</button>
          <button class="filter-btn" data-filter="personal">Personal</button>
          <button class="filter-btn" data-filter="design">Design</button>
        </div>
      </div>
      <div class="projects-grid page-fade" id="projectsGrid"></div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <p>Caleb Bellsmith · Biomedical Engineering · University of Waterloo</p>
      <div class="footer-links">
        <a href="mailto:calebb1360@gmail.com">calebb1360@gmail.com</a>
        <a href="https://linkedin.com/in/caleb-bellsmith-476359385" target="_blank">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script src="data/projects.js"></script>
  <script>
    const grid = document.getElementById('projectsGrid');

    function renderProjects(filter) {
      grid.innerHTML = '';
      const visible = filter === 'all'
        ? PROJECTS
        : PROJECTS.filter(p => p.categories && p.categories.includes(filter));

      visible.forEach(p => {
        const skills = p.skills.join(' · ');
        const card = document.createElement('a');
        card.href = `project.html?id=${p.id}`;
        card.className = 'proj-card';
        const imgStyle = p.thumbPosition ? `style="object-position: ${p.thumbPosition}"` : '';
        card.innerHTML = `
          <div class="proj-title">${p.title}</div>
          <div class="proj-thumb">
            <img src="${p.thumbnail}" alt="${p.title}" loading="lazy" ${imgStyle}>
          </div>
          <div class="proj-skills">${skills}</div>`;
        grid.appendChild(card);
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProjects(btn.dataset.filter);
      });
    });

    renderProjects('all');
  </script>

</body>
</html>
