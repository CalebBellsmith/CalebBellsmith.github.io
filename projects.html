<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Caleb Bellsmith</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #00d2ff; 
            --bg: #050505; 
            --card: rgba(20, 20, 20, 0.6); 
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* Subtle ambient glow in background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        .navbar { 
            background: rgba(5, 5, 5, 0.8) !important; 
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 0;
        }
        
        .navbar-brand { letter-spacing: 2px; font-weight: 800; color: var(--accent) !important; }

        /* Minimalist "Studio" Cards */
        .project-card { 
            border: 1px solid var(--border); 
            background: var(--card);
            backdrop-filter: blur(10px);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), border 0.3s ease; 
            margin-bottom: 6rem; 
            overflow: hidden; 
            border-radius: 24px;
        }
        
        .project-card:hover { 
            transform: scale(1.01);
            border-color: rgba(0, 210, 255, 0.4);
        }

        /* Matte black viewport for engineering assets */
        .asset-grid { 
            background-color: #000; 
            padding: 30px; 
            display: flex; 
            align-items: center; 
            position: relative;
        }

        .asset-img { 
            width: 100%; 
            height: 380px; 
            object-fit: contain; 
            border-radius: 12px; 
            background-color: #000; 
            cursor: pointer; 
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            filter: grayscale(20%) contrast(1.1);
        }

        .asset-img:hover { 
            transform: scale(1.05); 
            filter: grayscale(0%) contrast(1.1);
        }

        .asset-img-stacked { height: 186px !important; margin-bottom: 8px; }

        /* Typography Refinement */
        .tech-label { 
            font-weight: 600; 
            color: var(--accent); 
            text-transform: uppercase; 
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .project-title { 
            font-weight: 800; 
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .lead-text { color: #aaa; font-size: 1.1rem; line-height: 1.6; }
        .body-text { color: #888; font-size: 0.9rem; line-height: 1.7; margin-bottom: 1.2rem; }

        footer { 
            background: #000; 
            padding: 5rem 0; 
            border-top: 1px solid var(--border);
        }
        
        #lightboxImage { width: 100%; max-height: 85vh; object-fit: contain; }

        @media (min-width: 768px) {
            .row-alternate:nth-child(even) { flex-direction: row-reverse; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">CALEB BELLSMITH</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link px-3" href="index.html">Home</a>
            <a class="nav-link active px-3" href="projects.html">Projects</a>
            <a class="nav-link px-3" href="about.html">About</a>
        </div>
    </div>
</nav>

<div class="container my-5 pt-5">
    <div class="text-center mb-5">
        <span class="tech-label">Selected Works</span>
        <h1 class="display-3 fw-bold">Engineering Portfolio</h1>
    </div>
    <div id="project-list"></div>
</div>

<div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-black border-0">
            <div class="modal-body p-0 text-center">
                <img src="" id="lightboxImage" class="img-fluid">
                <div class="p-4">
                    <button type="button" class="btn btn-link text-white text-decoration-none" data-bs-dismiss="modal">CLOSE</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const projects = [
        {
            title: "Cedar Strip Canoe",
            lead: "A 17-foot custom build mixing traditional woodworking with digital fabrication.",
            why: "Blended outdoor passion with design concepts. Built to experiment with CNC machining and 3D modeling.",
            how: "Utilized CAD for molds and CNC for secondary molds to ensure high accuracy. Every cedar plank was milled from scratch.",
            specs: "17-foot build; custom-made components for a professional finish.",
            images: ["images/canoe.jpg", "images/stems.jpg"],
            layout: "normal",
            imgCol: "col-md-6"
        },
        {
            title: "Tilting Maze Platform",
            lead: "A modular, tilting platform featuring swappable mazes and ESP32 control.",
            why: "To gain experience with microcontrollers and rotational actuation in mechanical design.",
            how: "Designed and 3D printed components using high-torque servos and an ESP32 for responsiveness.",
            specs: "Custom-built circuitry; currently integrating webcam-based computer vision for autonomous navigation.",
            images: ["images/balance.jpg"],
            layout: "normal",
            imgCol: "col-md-12"
        },
        {
            title: "Hand Exoskeleton",
            lead: "A mechanical, 3D-printed device assisting individuals with limited mobility.",
            why: "Shifts heavy lifting from the hand/forearm via mechanical linkage.",
            how: "Iterated through dozens of 3D-printed prototypes for optimal strength and comfort.",
            specs: "100% 3D-printed; scalable design for specific finger support.",
            images: ["images/hand_exoskeleton.jpg", "images/test.jpg", "images/failures.jpg"],
            layout: "stacked",
            imgCol: "col-6"
        },
        {
            title: "Finger Prosthetics",
            lead: "3D-printed prosthetics for a patient with scleroderma.",
            why: "Focused on restoring writing ability and ensuring long-term functional fit.",
            how: "Modeled ergonomic designs with tool inserts and lockable rotation.",
            specs: "Custom-fitted and task-optimized for writing and orientation.",
            images: ["images/prosthetic_fingers.jpg", "images/issue.jpg", "images/fitted.jpg"],
            layout: "normal",
            imgCol: "col-md-4"
        }
    ];

    const projectList = document.getElementById('project-list');

    projects.forEach((project) => {
        let imageMarkup = "";
        if (project.layout === "stacked") {
            imageMarkup = `
                <div class="col-6">
                    <img src="${project.images[0]}" class="asset-img asset-img-stacked" onclick="openLightbox(this.src)">
                    <img src="${project.images[1]}" class="asset-img asset-img-stacked" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6">
                    <img src="${project.images[2]}" class="asset-img" style="height: 380px;" onclick="openLightbox(this.src)">
                </div>
            `;
        } else {
            imageMarkup = project.images.map(img => `
                <div class="${project.imgCol}">
                    <img src="${img}" class="asset-img mb-2" onclick="openLightbox(this.src)">
                </div>
            `).join('');
        }

        projectList.innerHTML += `
            <div class="card project-card">
                <div class="row g-0 row-alternate">
                    <div class="col-lg-6 asset-grid">
                        <div class="row g-2 w-100 justify-content-center">
                            ${imageMarkup}
                        </div>
                    </div>
                    <div class="col-lg-6 d-flex align-items-center">
                        <div class="card-body p-4 p-xl-5">
                            <span class="tech-label">Engineering Case Study</span>
                            <h2 class="project-title">${project.title}</h2>
                            <p class="lead lead-text mb-4">${project.lead}</p>
                            <p class="body-text"><span class="tech-label">The Challenge</span> ${project.why}</p>
                            <p class="body-text"><span class="tech-label">The Process</span> ${project.how}</p>
                            <p class="body-text"><span class="tech-label">Specifications</span> ${project.specs}</p>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    // SolidWorks Gallery
    projectList.innerHTML += `
        <div class="card project-card">
            <div class="card-body p-5 text-center">
                <span class="tech-label">Design Repository</span>
                <h2 class="project-title">Technical Design & SolidWorks Gallery</h2>
                <p class="lead lead-text mb-5">Various SolidWorks projects ranging from mechanical assemblies to aesthetic custom requests.</p>
                <div class="asset-grid rounded-4">
                    <div class="row g-3">
                        ${["swjet.jpg", "swflower.jpg", "flower.jpg", "snowman.jpg", "magno.png", "card.png"].map(img => `
                            <div class="col-6 col-md-4">
                                <img src="images/${img}" class="asset-img" onclick="openLightbox(this.src)">
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </div>
    `;

    const lbModal = new bootstrap.Modal(document.getElementById('lightboxModal'));
    const lbImage = document.getElementById('lightboxImage');
    function openLightbox(src) { lbImage.src = src; lbModal.show(); }
</script>
</body>
</html>
