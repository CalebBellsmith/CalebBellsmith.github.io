<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Caleb Bellsmith</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background-color: #005f73 !important; }
        .project-card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; margin-bottom: 4rem; overflow: hidden;}
        .project-card:hover { transform: translateY(-5px); }
        .asset-grid { background-color: #ebebeb; padding: 15px; }
        .asset-img { 
            width: 100%; height: 350px; object-fit: contain; 
            border-radius: 4px; background-color: #ebebeb;
            cursor: pointer; transition: 0.3s;
        }
        .asset-img:hover { opacity: 0.8; transform: scale(1.02); }
        .tech-label { font-weight: bold; color: #005f73; min-width: 70px; display: inline-block; }
        .text-teal { color: #005f73; }
        footer { background: #212529; color: white; padding: 3rem 0; }
        #lightboxImage { width: 100%; max-height: 85vh; object-fit: contain; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">CALEB BELLSMITH</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="projects.html">Projects</a>
            <a class="nav-link" href="about.html">About</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="display-4 fw-bold mb-5 text-center text-teal">Engineering Portfolio</h1>
    
    <div id="project-container"></div>
</div>

<div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 text-center">
                <img src="" id="lightboxImage" class="img-fluid rounded" alt="Large view">
                <button type="button" class="btn btn-light mt-3" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white py-5">
    <div class="container text-center">
        <h4 class="mb-3">Contact Me</h4>
        <p>Email: <a href="mailto:calebb1360@gmail.com" class="text-info">calebb1360@gmail.com</a></p>
        <p>LinkedIn: <a href="https://linkedin.com/in/caleb-bellsmith-476359385" target="_blank" class="text-info">Profile</a></p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 1. DATA: This is your source of truth. Add a new object {} here to add a new project!
    const projects = [
        {
            title: "Custom Cedar Strip Canoe",
            lead: "Designed and built a custom 17-foot cedar strip canoe.",
            why: "Blend love for outdoors with advanced design tools.",
            how: "Used CAD/3D modeling and CNC-machined molds.",
            specs: "17-foot classic cedar strip build.",
            images: ["images/canoe.jpg", "images/stems.jpg"],
            columns: "col-md-6", // Two large images
            textFirst: false     // Images on top
        },
        {
            title: "Orthotic Hand Exoskeleton",
            lead: "Mechanical 3D-printed orthotic for upper-limb mobility.",
            why: "Help users with weak forearm strength.",
            how: "Dozens of 3D-printed iterations and user feedback.",
            specs: "100% 3D-printed, scalable mechanical system.",
            images: ["images/hand_exoskeleton.jpg", "images/test.jpg", "images/failures.jpg"],
            columns: "col-md-4", // Three images per row
            textFirst: false
        },
        {
            title: "Technical Design & SolidWorks Gallery",
            lead: "Various projects designed and created for custom requests.",
            images: ["images/swjet.jpg", "images/swflower.jpg", "images/flower.jpg", "images/snowman.jpg", "images/magno.png"],
            columns: "col-md-6", // Your requested 2-per-row layout
            textFirst: true      // Text on top
        }
    ];

    // 2. LOGIC: The function that turns that data into HTML
    const container = document.getElementById('project-container');

    projects.forEach(proj => {
        const imageHtml = proj.images.map(img => `
            <div class="${proj.columns}">
                <img src="${img}" class="asset-img" onclick="openLightbox('${img}')" alt="${proj.title}">
            </div>
        `).join('');

        const textHtml = `
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3 border-bottom pb-2">${proj.title}</h3>
                <p class="lead">${proj.lead}</p>
                ${proj.why ? `<p><span class="tech-label">Why:</span> ${proj.why}</p>` : ''}
                ${proj.how ? `<p><span class="tech-label">How:</span> ${proj.how}</p>` : ''}
                ${proj.specs ? `<p><span class="tech-label">Specs:</span> ${proj.specs}</p>` : ''}
            </div>
        `;

        const cardHtml = `
            <div class="card project-card">
                ${proj.textFirst ? textHtml : ''}
                <div class="asset-grid">
                    <div class="row g-2">${imageHtml}</div>
                </div>
                ${!proj.textFirst ? textHtml : ''}
            </div>
        `;
        container.innerHTML += cardHtml;
    });

    // Lightbox Logic
    const lbModal = new bootstrap.Modal(document.getElementById('lightboxModal'));
    const lbImage = document.getElementById('lightboxImage');
    function openLightbox(src) {
        lbImage.src = src;
        lbModal.show();
    }
</script>

</body>
</html>
