<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Caleb Bellsmith</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --teal-main: #005f73; 
            --bg-fresh: #ffffff;
            --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            --border-light: #f1f3f5;
        }

        body {
            background-color: var(--bg-fresh);
            color: #1a1a1b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
        }

        .navbar { 
            background: rgba(255, 255, 255, 0.9) !important; 
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-light);
            padding: 1.2rem 0;
        }
        
        .navbar-brand { font-weight: 800; color: var(--teal-main) !important; letter-spacing: -0.5px; }
        .nav-link { color: #495057 !important; font-weight: 500; }
        .nav-link.active { color: var(--teal-main) !important; font-weight: 700; }

        /* Clean "High-Performance" Cards */
        .project-card { 
            border: 1px solid var(--border-light); 
            background: #ffffff;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.4s ease; 
            margin-bottom: 5rem; 
            overflow: hidden; 
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }
        
        .project-card:hover { 
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        /* Black image containers to keep your assets crisp */
        .asset-grid { 
            background-color: #000; 
            padding: 25px; 
            display: flex; 
            align-items: center; 
        }

        .asset-img { 
            width: 100%; 
            height: 360px; 
            object-fit: contain; 
            border-radius: 12px; 
            background-color: #000; 
            cursor: pointer; 
            transition: transform 0.5s ease;
        }

        .asset-img:hover { transform: scale(1.03); }
        .asset-img-stacked { height: 176px !important; margin-bottom: 8px; }

        /* Modern Typography */
        .tech-label { 
            font-weight: 700; 
            color: var(--teal-main); 
            text-transform: uppercase; 
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            margin-bottom: 0.8rem;
            display: block;
        }
        
        .project-title { 
            font-weight: 800; 
            font-size: 2rem;
            color: #000;
            margin-bottom: 1.2rem;
        }
        
        .lead-text { color: #495057; font-size: 1.05rem; line-height: 1.6; font-weight: 500; }
        .body-text { color: #6c757d; font-size: 0.95rem; line-height: 1.7; margin-bottom: 1rem; }

        footer { 
            background: #f8f9fa; 
            padding: 4rem 0; 
            border-top: 1px solid var(--border-light);
        }
        
        .modal-content { background-color: #000; border: none; }
        #lightboxImage { width: 100%; max-height: 85vh; object-fit: contain; }

        @media (min-width: 768px) {
            .row-alternate:nth-child(even) { flex-direction: row-reverse; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">CALEB BELLSMITH</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link px-3" href="index.html">Home</a>
            <a class="nav-link active px-3" href="projects.html">Projects</a>
            <a class="nav-link px-3" href="about.html">About</a>
        </div>
    </div>
</nav>

<div class="container my-5 pt-4">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold" style="color: var(--teal-main);">Engineering Portfolio</h1>
        <p class="text-muted">A selection of technical designs and fabrication projects.</p>
    </div>
    <div id="project-list"></div>
</div>

<div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
            <div class="modal-body p-0 text-center">
                <img src="" id="lightboxImage" class="img-fluid">
                <div class="p-3">
                    <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const projects = [
        {
            title: "Custom Cedar Strip Canoe",
            lead: "A 17-foot custom build mixing traditional woodworking with digital fabrication.",
            why: "I wanted to blend my love for the outdoors with advancing design concepts. Built to experiment with CNC machining and 3D modeling.",
            how: "Used CAD and 3D modeling for molds, then CNC-machined secondary molds for accuracy. Each cedar plank was milled from scratch.",
            specs: "17-foot build; custom-made components for a professional finish.",
            images: ["images/canoe.jpg", "images/stems.jpg"],
            layout: "normal",
            imgCol: "col-md-6"
        },
        {
            title: "Tilting Maze Platform",
            lead: "A modular, tilting platform featuring swappable mazes and ESP32 control.",
            why: "To gain experience with microcontrollers and rotational actuation in mechanical design.",
            how: "Designed and 3D printed components using high-torque servos and an ESP32 for responsiveness.",
            specs: "Custom-built circuitry; integrating webcam-based computer vision for autonomous navigation.",
            images: ["images/balance.jpg"],
            layout: "normal",
            imgCol: "col-md-12"
        },
        {
            title: "Orthotic Hand Exoskeleton",
            lead: "A fully mechanical, 3D-printed device designed to assist individuals with limited mobility.",
            why: "Shifts heavy lifting from the hand/forearm via a mechanical linkage system.",
            how: "Iterated through dozens of 3D-printed prototypes for optimal strength and comfort.",
            specs: "100% 3D-printed; scalable design for customized finger support.",
            images: ["images/hand_exoskeleton.jpg", "images/test.jpg", "images/failures.jpg"],
            layout: "stacked",
            imgCol: "col-6"
        },
        {
            title: "Custom Finger Prosthetics",
            lead: "Custom 3D-printed prosthetic fingers developed for a patient with scleroderma.",
            why: "Focused on restoring writing ability and ensuring long-term functional fit.",
            how: "Modeled ergonomic designs featuring specialized tool inserts and lockable rotation.",
            specs: "Custom-fitted and task-optimized for writing and orientation.",
            images: ["images/prosthetic_fingers.jpg", "images/issue.jpg", "images/fitted.jpg"],
            layout: "normal",
            imgCol: "col-md-4"
        }
    ];

    const projectList = document.getElementById('project-list');

    projects.forEach((project) => {
        let imageMarkup = "";
        if (project.layout === "stacked") {
            imageMarkup = `
                <div class="col-6">
                    <img src="${project.images[0]}" class="asset-img asset-img-stacked" onclick="openLightbox(this.src)">
                    <img src="${project.images[1]}" class="asset-img asset-img-stacked" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6">
                    <img src="${project.images[2]}" class="asset-img" style="height: 360px;" onclick="openLightbox(this.src)">
                </div>
            `;
        } else {
            imageMarkup = project.images.map(img => `
                <div class="${project.imgCol}">
                    <img src="${img}" class="asset-img mb-2" onclick="openLightbox(this.src)">
                </div>
            `).join('');
        }

        projectList.innerHTML += `
            <div class="card project-card">
                <div class="row g-0 row-alternate">
                    <div class="col-lg-6 asset-grid">
                        <div class="row g-2 w-100 justify-content-center">
                            ${imageMarkup}
                        </div>
                    </div>
                    <div class="col-lg-6 d-flex align-items-center">
                        <div class="card-body p-4 p-xl-5">
                            <span class="tech-label">Engineering Project</span>
                            <h2 class="project-title">${project.title}</h2>
                            <p class="lead-text mb-4">${project.lead}</p>
                            <p class="body-text"><span class="tech-label">Purpose</span> ${project.why}</p>
                            <p class="body-text"><span class="tech-label">Methodology</span> ${project.how}</p>
                            <p class="body-text"><span class="tech-label">Specifications</span> ${project.specs}</p>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    // SolidWorks Gallery
    projectList.innerHTML += `
        <div class="card project-card">
            <div class="card-body p-5 text-center">
                <span class="tech-label">Design Repository</span>
                <h2 class="project-title">Technical Design & SolidWorks Gallery</h2>
                <p class="lead-text mb-5">A collection of various SolidWorks projects ranging from mechanical assemblies to aesthetic custom requests.</p>
                <div class="asset-grid rounded-4">
                    <div class="row g-3">
                        ${["swjet.jpg", "swflower.jpg", "flower.jpg", "snowman.jpg", "magno.png", "card.png"].map(img => `
                            <div class="col-6 col-md-4">
                                <img src="images/${img}" class="asset-img" onclick="openLightbox(this.src)">
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </div>
    `;

    const lbModal = new bootstrap.Modal(document.getElementById('lightboxModal'));
    const lbImage = document.getElementById('lightboxImage');
    function openLightbox(src) { lbImage.src = src; lbModal.show(); }
</script>
</body>
</html>
