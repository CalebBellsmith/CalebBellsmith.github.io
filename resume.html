  <main>
    <div class="page-container">
      <div class="resume-page page-fade">

        <div class="resume-bar">
          <h1 class="resume-heading">Resume</h1>
          <div class="resume-actions">
            <a id="resumeOpen" class="btn-ghost" target="_blank" rel="noopener">Open in new tab</a>
            <a id="resumeDownload" class="btn-primary" download>Download PDF</a>
          </div>
        </div>

        <!-- Desktop: the PDF renders inline here -->
        <div class="resume-viewer">
          <iframe id="resumeFrame" title="Caleb Bellsmith resume" loading="lazy"></iframe>
        </div>

        <!-- Small screens: most mobile browsers refuse to render a PDF in an
             iframe, so they get a clear card instead of a blank grey box -->
        <div class="resume-mobile">
          <p>Resumes read poorly squeezed onto a phone screen, so this one opens full size.</p>
          <a id="resumeOpenMobile" class="btn-primary" target="_blank" rel="noopener">Open resume PDF</a>
        </div>

      </div>
    </div>

    </div>

  <script>
    /* The resume is whatever PDF is sitting in images/ on GitHub, so updating it
       means replacing the file and nothing else. This asks GitHub what is
       actually in that folder, then falls back to the known filename if the
       lookup fails for any reason (offline, rate limited, API down).

       If several PDFs are present, one whose name contains "resume" or "cv"
       wins; otherwise the first alphabetically. */
    const FALLBACK_PDF = 'images/Caleb_Bellsmith.pdf';
    const CONTENTS_API =
      'https://api.github.com/repos/CalebBellsmith/CalebBellsmith.github.io/contents/images';

    async function findResumePdf() {
      try {
        const ctrl = new AbortController();
        const bail = setTimeout(() => ctrl.abort(), 3000);
        const res = await fetch(CONTENTS_API, { signal: ctrl.signal });
        clearTimeout(bail);
        if (!res.ok) throw new Error('lookup failed');

        const pdfs = (await res.json())
          .filter(f => f.type === 'file' && /\.pdf$/i.test(f.name))
          .sort((a, b) => a.name.localeCompare(b.name));
        if (!pdfs.length) throw new Error('no pdf in images/');

        const pick = pdfs.find(f => /resume|cv/i.test(f.name)) || pdfs[0];
        // The sha changes whenever the file does, which sidesteps browser caching
        return 'images/' + encodeURIComponent(pick.name) + '?v=' + pick.sha.slice(0, 8);
      } catch (err) {
        return FALLBACK_PDF;
      }
    }

    findResumePdf().then(url => {
      // Hide the built in PDF toolbar and sidebar in the embed so it sits
      // quietly in the page. The real links keep them, since anyone opening
      // or downloading the file wants those controls.
      const embedded = url + '#toolbar=0&navpanes=0&scrollbar=0&view=FitH';

      document.getElementById('resumeFrame').src = embedded;
      document.getElementById('resumeOpen').href = url;
      document.getElementById('resumeOpenMobile').href = url;
      document.getElementById('resumeDownload').href = url;
    });
  </script>
